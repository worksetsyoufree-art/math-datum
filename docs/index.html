<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Datum & CRS Finder</title>
<meta name="description" content="Datum and coordinate system finder: pick the right datum and projection for a place and a task, convert coordinates, identify an unknown CRS. / Подбор датума и системы координат.">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="titlebar">
      <div>
        <h1 data-i18n="title">Datum & CRS Finder</h1>
        <p class="sub" data-i18n="subtitle"></p>
      </div>
      <label class="lang"><span data-i18n="language">Language</span>
        <select id="lang" aria-label="Language"></select>
      </label>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="finder" aria-selected="true" data-i18n="tabFinder"></button>
      <button role="tab" data-tab="identify" aria-selected="false" data-i18n="tabIdentify"></button>
      <button role="tab" data-tab="convert" aria-selected="false" data-i18n="tabConvert"></button>
      <button role="tab" data-tab="catalog" aria-selected="false" data-i18n="tabCatalog"></button>
      <button role="tab" data-tab="about" aria-selected="false" data-i18n="tabAbout"></button>
    </nav>
  </div>
</header>

<main class="wrap">
  <!-- ============ FINDER ============ -->
  <section id="tab-finder" class="panel">
    <div class="card">
      <h2 data-i18n="whereTitle"></h2>
      <div class="grid2">
        <label><span data-i18n="lat"></span><input id="lat" inputmode="text" data-i18n-ph="latPh" value="55.7558" autocomplete="off"></label>
        <label><span data-i18n="lon"></span><input id="lon" inputmode="text" data-i18n-ph="lonPh" value="37.6173" autocomplete="off"></label>
      </div>
      <div class="grid2">
        <label><span data-i18n="example"></span><select id="example"></select></label>
        <label><span data-i18n="placeSearch"></span><input id="place" data-i18n-ph="placeSearchPh" autocomplete="off"></label>
      </div>
      <div class="row">
        <button id="myloc" class="ghost" data-i18n="myLoc"></button>
        <span id="locmsg" class="muted"></span>
      </div>
      <div id="placeres" class="zones"></div>
      <p class="note" data-i18n="placeHint"></p>
    </div>

    <div class="card">
      <h2 data-i18n="purposeTitle"></h2>
      <div class="purposes" role="radiogroup">
        <label class="pcard"><input type="radio" name="purpose" value="gnss"><b data-i18n="p_gnss"></b><span data-i18n="p_gnss_d"></span></label>
        <label class="pcard"><input type="radio" name="purpose" value="survey" checked><b data-i18n="p_survey"></b><span data-i18n="p_survey_d"></span></label>
        <label class="pcard"><input type="radio" name="purpose" value="legacy"><b data-i18n="p_legacy"></b><span data-i18n="p_legacy_d"></span></label>
      </div>
      <label class="check"><input type="checkbox" id="showUnv"> <span data-i18n="showUnverified"></span></label>
    </div>

    <h2 class="sect" data-i18n="resultsTitle"></h2>
    <div id="datums" class="dlist"></div>
    <div id="detail"></div>
    <h2 class="sect" id="projh" data-i18n="projTitle" hidden></h2>
    <div id="projs"></div>
  </section>

  <!-- ============ IDENTIFY ============ -->
  <section id="tab-identify" class="panel" hidden>
    <div class="card">
      <h2 data-i18n="idTitle"></h2>
      <p class="muted" data-i18n="idDesc"></p>
      <div class="grid2">
        <label><span data-i18n="inE"></span><input id="id-e" inputmode="decimal" placeholder="1365816.032"></label>
        <label><span data-i18n="inN"></span><input id="id-n" inputmode="decimal" placeholder="478559.171"></label>
      </div>
      <h3 data-i18n="idHint"></h3>
      <div class="grid3b">
        <label><span data-i18n="lat"></span><input id="id-lat" inputmode="text" placeholder="55.83"></label>
        <label><span data-i18n="lon"></span><input id="id-lon" inputmode="text" placeholder="37.33"></label>
        <label><span data-i18n="idRadius"></span><input id="id-r" inputmode="decimal" value="300"></label>
      </div>
      <div class="row">
        <button id="id-go" class="primary" data-i18n="idFind"></button>
        <button id="id-ex" class="ghost" data-i18n="idExample"></button>
        <span id="id-msg" class="muted"></span>
      </div>
    </div>
    <div id="id-out"></div>
  </section>

  <!-- ============ CONVERT ============ -->
  <section id="tab-convert" class="panel" hidden>
    <div class="card">
      <h2 data-i18n="convTitle"></h2>
      <div class="grid2">
        <div><label><span data-i18n="from"></span></label><div class="picker" id="pk-from"><input class="pk-in" data-i18n-ph="pickCrs" autocomplete="off"><ul class="pk-list" hidden></ul></div></div>
        <div><label><span data-i18n="to"></span></label><div class="picker" id="pk-to"><input class="pk-in" data-i18n-ph="pickCrs" autocomplete="off"><ul class="pk-list" hidden></ul></div></div>
      </div>
      <div class="grid2">
        <label><span id="cv-l1"></span><input id="cv-a" inputmode="text"></label>
        <label><span id="cv-l2"></span><input id="cv-b" inputmode="text"></label>
      </div>
      <div class="row"><button id="cv-swap" class="ghost" data-i18n="swap"></button><span class="muted" data-i18n="geoOrder"></span></div>
      <h3 data-i18n="result"></h3>
      <div id="cv-out" class="out"></div>
    </div>
  </section>

  <!-- ============ CATALOG ============ -->
  <section id="tab-catalog" class="panel" hidden>
    <div class="card">
      <h2 data-i18n="catTitle"></h2>
      <div class="grid3">
        <label><span data-i18n="catSearch"></span><input id="c-q" data-i18n-ph="catSearchPh" autocomplete="off"></label>
        <label><span data-i18n="catType"></span>
          <select id="c-type"><option value="all" data-i18n="t_all"></option><option value="geo" data-i18n="t_geo"></option><option value="proj" data-i18n="t_proj"></option><option value="msk" data-i18n="t_msk"></option></select>
        </label>
        <label class="check bottom"><input type="checkbox" id="c-ver" checked> <span data-i18n="ruOnlyVerified"></span></label>
      </div>
      <div class="muted" id="c-count"></div>
    </div>
    <div class="tablewrap"><table id="c-tbl"><tbody></tbody></table></div>
  </section>

  <!-- ============ ABOUT ============ -->
  <section id="tab-about" class="panel" hidden>
    <div class="card prose" id="about"></div>
  </section>
</main>

<footer class="wrap foot">
  <span id="built"></span> · EPSG, PROJ/pyproj · proj4js · <a href="https://github.com/worksetsyoufree-art/math-datum">GitHub</a>
</footer>

<script src="vendor/proj4-2.12.1.js"></script>
<script src="js/i18n.js"></script>
<script src="js/engine.js"></script>
<script src="data/world-geo.js"></script>
<script src="data/world-meta.js"></script>
<script src="js/app.js"></script>
</body>
</html>
