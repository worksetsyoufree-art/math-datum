name: ci
on:
  push:
  pull_request:
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests (desktop JVM, JS/Node, Android unit)
        run: gradle --no-daemon :core:desktopTest :core:jsNodeTest :core:testDebugUnitTest
